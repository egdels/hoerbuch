[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoerbuch"
version = "0.1.0"
description = "EPUB oder TXT zum deutschen Hörbuch (M4B mit Kapitelmarken), lokal auf Apple Silicon mit Qwen3-TTS"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Christian Kierdorf" }]
requires-python = ">=3.10"
keywords = ["hörbuch", "audiobook", "tts", "qwen3-tts", "mlx", "epub", "deutsch", "german"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-audio>=0.5.8",
    "numpy>=2.0",
    "num2words>=0.5.14",   # Zahlen als Zahlwörter
    "ftfy>=6.3",           # kaputte Umlaute reparieren
]

[project.optional-dependencies]
ki = ["mlx-lm>=0.32"]      # nur für "bereinigen --ki" (lokales Sprachmodell)
dev = ["pytest>=8"]

[project.scripts]
hoerbuch = "hoerbuch.cli:main"

[project.urls]
Homepage = "https://github.com/egdels/hoerbuch"
Issues = "https://github.com/egdels/hoerbuch/issues"

[tool.setuptools]
packages = ["hoerbuch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
